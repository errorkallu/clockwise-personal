; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
name = Clockwise

[env:native]
platform = native
test_framework = unity
test_ignore = test_embedded
; cw-commons depends on Arduino; native tests include its pure C++ headers by path.
lib_ignore = cw-commons

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_ignore = test_native
monitor_speed = 115200
lib_deps = 
	https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git#3.0.12
	adafruit/Adafruit GFX Library@^1.10.1
	adafruit/Adafruit BusIO@^1.5.0
	SPI
	Wire
	ropg/ezTime@^0.8.3
	https://github.com/jnthas/Improv-WiFi-Library
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson@^6.21.2
	bitbank2/PNGdec@1.1.3
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<clockfaces/>
; All clockfaces are compiled in from src/clockfaces/; a copy left in lib/ must not be built twice.
lib_ignore = cw-cf-0x01, cw-cf-0x02, cw-cf-0x03, cw-cf-0x04, cw-cf-0x05, cw-cf-0x06, cw-cf-0x07
; No OTA is used, so take the 3 MB app partition (NVS, and so all settings, stays where it was).
board_build.partitions = huge_app.csv
build_flags = 
	-D CW_FW_VERSION="\"1.4.4\""
	-D CW_FW_NAME="\"${sysenv.FW_NAME}\""
